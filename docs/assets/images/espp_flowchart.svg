<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" style="font-family: Arial, sans-serif; background-color: #f8f9fa;">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#333" />
        </marker>
    </defs>

    <!-- Node A: תחילת תקופה -->
    <rect x="100" y="20" width="200" height="60" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="200" y="45" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">תחילת תקופה</text>
    <text x="200" y="65" font-size="14" text-anchor="middle" fill="#666">שער מנייה ראשון</text>

    <!-- Arrow A -> B -->
    <line x1="200" y1="80" x2="200" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />
    <text x="210" y="120" font-size="14" text-anchor="start" fill="#333">הפרשה חודשית מהשכר</text>

    <!-- Node B: סוף תקופה -->
    <rect x="100" y="150" width="200" height="60" rx="30" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="200" y="175" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">סוף תקופה</text>
    <text x="200" y="195" font-size="14" text-anchor="middle" fill="#666">שער מנייה שני</text>

    <!-- Arrow B -> C -->
    <line x1="200" y1="210" x2="200" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Decision C: איזה שער נמוך יותר? -->
    <polygon points="200,250 280,290 200,330 120,290" fill="#e2f0d9" stroke="#548235" stroke-width="2"/>
    <text x="200" y="285" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">איזה שער</text>
    <text x="200" y="305" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">?נמוך יותר</text>

    <!-- Arrow C -> D (Left) -->
    <path d="M120,290 L100,290 L100,360" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="110" y="280" font-size="14" text-anchor="end" fill="#333">שער שני</text>

    <!-- Arrow C -> E (Right) -->
    <path d="M280,290 L300,290 L300,360" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    <text x="290" y="280" font-size="14" text-anchor="start" fill="#333">שער ראשון</text>

    <!-- Node D: רכישה לפי שער ראשון -->
    <rect x="10" y="360" width="180" height="60" rx="5" fill="#c9daf8" stroke="#2f5597" stroke-width="2"/>
    <text x="100" y="385" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">רכישה לפי שער 2</text>
    <text x="100" y="405" font-size="14" text-anchor="middle" fill="#333">(בהנחה של 15%)</text>

    <!-- Node E: רכישה לפי שער שני -->
    <rect x="210" y="360" width="180" height="60" rx="5" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/>
    <text x="300" y="385" font-size="14" text-anchor="middle" font-weight="bold" fill="#333">רכישה לפי שער 1</text>
    <text x="300" y="405" font-size="14" text-anchor="middle" fill="#333">(בהנחה של 15%)</text>

    <!-- Arrow D -> F -->
    <path d="M100,420 L100,460 L180,460 L180,490" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
    
    <!-- Arrow E -> F -->
    <path d="M300,420 L300,460 L220,460 L220,490" stroke="#333" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

    <!-- Node F: קבלת מניות -->
    <rect x="100" y="490" width="200" height="60" rx="5" fill="#e2efda" stroke="#548235" stroke-width="2"/>
    <text x="200" y="515" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">קבלת מניות</text>
    <text x="200" y="535" font-size="16" text-anchor="middle" font-weight="bold" fill="#333">לעובד</text>
</svg>
